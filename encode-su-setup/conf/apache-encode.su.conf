# Local mirror of the encode.su vBulletin forum (PHP through PHP-FPM)
<VirtualHost *:80>
    ServerName encode.su
    ServerAlias www.encode.su localhost 127.0.0.1
    DocumentRoot /var/www/encode.su

    <Directory /var/www/encode.su>
        Options FollowSymLinks
        # .htaccess provides the friendly-URL rewrites (threads/, forums/, members/ ...)
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # setup.sh fills in the PHP version
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php@PHP_VERSION@-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/encode.su-error.log
    CustomLog ${APACHE_LOG_DIR}/encode.su-access.log combined
</VirtualHost>
