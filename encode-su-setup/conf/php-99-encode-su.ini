; Local overrides for the encode.su vBulletin 4.2.6 mirror (PHP-FPM and CLI).
; setup.sh adds error_log = /var/log/php/php<version>-encode.log to the FPM copy.
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
display_errors = Off
log_errors = On
